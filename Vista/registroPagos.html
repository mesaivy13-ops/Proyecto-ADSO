<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pagos de Cuotas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Registrar Pago de Cuota</h3>
                </div>
                <div class="card-body">
                    <form action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="valorCuota" class="form-label">Valor de la Cuota</label>
                            <input type="number" step="0.01" class="form-control" id="valorCuota" name="valorCuota" placeholder="0.00" required>
                        </div>

                        <div class="mb-3">
                            <label for="fechaPago" class="form-label">Fecha de Pago</label>
                            <input type="date" class="form-control" id="fechaPago" name="fechaPago" required>
                        </div>

                        <div class="mb-3">
                            <label for="idPrestamo" class="form-label">ID del Préstamo</label>
                            <input type="number" class="form-link form-control" id="idPrestamo" name="idPrestamo" placeholder="Ej: 1" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Guardar Pago</button>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
