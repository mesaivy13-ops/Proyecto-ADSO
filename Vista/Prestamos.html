<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <title>Proyecto ADSO - Préstamos</title>
    <style>
        .header-mr {
            background-color: rgb(32, 69, 231);
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>

<body class="bg-light">
    <header class="header-mr d-flex justify-content-between align-items-center gap-3">
        <h1 class="h3 mb-0">Préstamos del club</h1>
        <a class="btn btn-outline-light" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>

    <main class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
            <p class="mb-0 text-muted">
                Consulta los préstamos registrados y su información.
            </p>
            <div>
                <button id="nuevoPrestamo" class="btn btn-success d-none" type="button">
                    <i class="bi bi-plus-lg"></i>
                    Nuevo préstamo
                </button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Asociado</th>
                            <th scope="col">Valor préstamo</th>
                            <th scope="col">Tasa interés (%)</th>
                            <th scope="col">N° Cuotas</th>
                            <th scope="col">Fecha préstamo</th>
                            <th scope="col">Estado</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaPrestamos">
                        <tr>
                            <td colspan="6" class="text-center py-4">
                                Cargando préstamos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Notificación Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastPrestamo" class="toast align-items-center text-bg-success border-0" role="status"
            aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="mensajePrestamos" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPrestamo" tabindex="-1" aria-labelledby="tituloModalPrestamo" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formPrestamo">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="tituloModalPrestamo">
                            Nuevo Préstamo
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <!-- Llave primaria oculta -->
                        <input type="hidden" id="idPrestamo" name="idPrestamo" />

                        
                        <div class="mb-3">
                            <label for="idAsociado" class="form-label">Asociado</label>
                            <select class="form-select" id="idAsociado" name="idAsociado" required>
                                <option value="" selected disabled>Seleccione un asociado...</option>
                            </select>
                        </div>

                        <!-- valorPrestamo (DECIMAL 12,2) -->
                        <div class="mb-3">
                            <label for="valorPrestamo" class="form-label">Valor del préstamo</label>
                            <input type="number" class="form-control" id="valorPrestamo" name="valorPrestamo"
                                min="0" max="9999999999.99" step="0.01" placeholder="Ej.: 1500000.00" required />
                        </div>

                        <!-- tasaInteres (DECIMAL 5,2) -->
                        <div class="mb-3">
                            <label for="tasaInteres" class="form-label">Tasa de interés (%)</label>
                            <input type="number" class="form-control" id="tasaInteres" name="tasaInteres"
                                min="0" max="999.99" step="0.01" placeholder="Ej.: 1.50" required />
                        </div>

                        <!-- numeroCuotas (INT) -->
                        <div class="mb-3">
                            <label for="numeroCuotas" class="form-label">Número de cuotas</label>
                            <input type="number" class="form-control" id="numeroCuotas" name="numeroCuotas"
                                min="1" step="1" placeholder="Ej.: 12" required />
                        </div>

                        <!-- fechaPrestamo (DATE) -->
                        <div class="mb-3">
                            <label for="fechaPrestamo" class="form-label">Fecha del préstamo</label>
                            <input type="date" class="form-control" id="fechaPrestamo" name="fechaPrestamo" required />
                        </div>

                        <!-- estado (ENUM) -->
                        <div id="campoEstado" class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" name="estado" required>
                                <option value="Pendiente" selected>Pendiente</option>
                                <option value="Aprobado">Aprobado</option>
                                <option value="Pagado">Pagado</option>
                                <option value="Rechazado">Rechazado</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarPrestamo" type="submit" class="btn btn-primary">Guardar préstamo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/prestamos.js?v=2026112502"></script>
</body>

</html>
