<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <title>Proyecto ADSO</title>
    <style>
        .header-mr {
            background-color: rgb(32, 69, 231);
            color: white;
            padding: 20px 30px;
        }
    </style>
</head>

<body class="bg-light">
    <header class="header-mr d-flex justify-content-between align-items-center gap-3">
        <h1 class="h3 mb-0">Asociados del club</h1>
        <a class="btn btn-outline-light" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>
    <main class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
            <p class="mb-0 text-muted">
                Consulta los asociados registrados y su información.
            </p>
            <div>
                <button id="nuevoAsociado" class="btn btn-success d-none" type="button">
                    <i class="bi biplus-lg"></i>
                    Nuevo Asociado
                </button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Documento</th>
                            <th scope="col">Asociado</th>
                            <th scope="col">Fecha Nacimiento</th>
                            <th scope="col">Direccion Residencia</th>
                            <th scope="col">Genero</th>
                            <th scope="col">Ciudad</th>
                            <th scope="col">Telefono</th>
                            <th scope="col">Email</th>
                            <th scope="col">Rol</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastActividad" class="toast align-items-center text-bg-success border-0" role="status"
            aria-live="polite" aria-atomic="true">
            <div class="d-flex">
                <div id="mensajeActividades" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Cerrar"></button>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalActividad" tabindex="-1" aria-labelledby="tituloModalAsociado" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAsociado">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="tituloModalAsociado">
                            Nueva asociado
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="idAsociado" />

                        <div class="mb-3">
                            <label for="documento" class="form-label">
                                Documento
                            </label>
                            <input type="text" class="form-control" id="documento" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="nombreAsociado" class="form-label">
                                Nombres del Asociado
                            </label>
                            <input type="text" class="form-control" id="nombreAsociado" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellidoAsociado" class="form-label">
                                Apellidos del Asociado
                            </label>
                            <input type="text" class="form-control" id="apellidoAsociado" maxlength="100" required>
                        </div>
                        <div class="mb-3">
                            <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Seleccione su Género</label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="Femenino" name="genero"
                                    value="Femenino" required>
                                <label class="form-check-label" for="Femenino">Femenino</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="Masculino" name="genero"
                                    value="Masculino" required>
                                <label class="form-check-label" for="Masculino">Masculino</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="Otro" name="genero" value="Otro"
                                    required>
                                <label class="form-check-label" for="Otro">Otro</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="direccionResidencia" class="form-label">Dirección de Residencia</label>
                            <input type="text" class="form-control" id="direccionResidencia" maxlength="150" required>
                        </div>

                        <div class="mb-3">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="ciudad" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" maxlength="20" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" maxlength="120" required>
                        </div>
                        <div class="mb-3">
                            <label for="rol" class="form-label">Rol</label>
                            <select class="form-select" id="rol" required>
                                <option value="asociado">Asociado</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button id="guardarAsociado" type="submit" class="btn btn-primary">Guardar asociado</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Controladores/AsociadoAdmin.js?v=2026112505"></script>
</body>

</html>
