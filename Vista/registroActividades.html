<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Registrar Actividad</h3>
                </div>
                <div class="card-body">
                    <form action="#" method="POST">
                        
                        <div class="mb-3">
                            <label for="nombreActividad" class="form-label">Nombre de la Actividad</label>
                            <input type="text" class="form-control" id="nombreActividad" name="nombreActividad" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label for="fechaEvento" class="form-label">Fecha del Evento</label>
                            <input type="date" class="form-control" id="fechaEvento" name="fechaEvento" required>
                        </div>

                        <div class="mb-3">
                            <label for="municipio" class="form-label">Municipio</label>
                            <input type="text" class="form-control" id="municipio" name="municipio" maxlength="50" required>
                        </div>

                        <div class="mb-3">
                            <label for="totalRecaudado" class="form-label">Total Recaudado</label>
                            <input type="number" step="0.01" class="form-control" id="totalRecaudado" name="totalRecaudado" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Guardar</button>

                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
