<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>Mis datos | Proyecto ADSO</title>
</head>

<body class="bg-light">
    <header class="bg-primary text-white px-4 py-3 d-flex justify-content-between align-items-center gap-3">
        <h1 class="h3 mb-0">Mis datos</h1>
        <a class="btn btn-outline-light" href="dashboard.html">
            <i class="bi bi-arrow-left"></i>
            Volver al panel
        </a>
    </header>

    <main class="container py-4">
        <div class="card shadow-sm mx-auto" style="max-width: 760px;">
            <div class="card-body p-4">
                <p class="text-muted">Consulta y actualiza tu información personal. La contraseña y el rol no se pueden editar aquí.</p>
                <div id="mensajePerfil" class="alert d-none" role="status" aria-live="polite"></div>
                <form id="formMisDatos">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="documento" class="form-label">Documento</label>
                            <input type="text" class="form-control" id="documento" name="documento" maxlength="100" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text" class="form-control" id="nombres" name="nombres" maxlength="100" required>
                        </div>
                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" name="apellidos" maxlength="100" required>
                        </div>
                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                        </div>
                        <div class="col-md-6">
                            <label for="genero" class="form-label">Género</label>
                            <select class="form-select" id="genero" name="genero" required>
                                <option value="">Selecciona una opción</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="direccionResidencia" class="form-label">Dirección de residencia</label>
                            <input type="text" class="form-control" id="direccionResidencia" name="direccionResidencia" maxlength="150" required>
                        </div>
                        <div class="col-md-6">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="ciudad" name="ciudad" maxlength="100" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" maxlength="20" required>
                        </div>
                        <div class="col-12">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" maxlength="120" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <button id="guardarMisDatos" type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i>
                            Guardar cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script src="../Controladores/MisDatos.js?v=2026112501"></script>
</body>

</html>
